<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPE Loja de Eletrônicos - Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #F5F5F5;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
        }
        .login-header {
            background-color: #003399;
            color: #FFFFFF;
            border-radius: 12px 12px 0 0;
            padding: 2rem;
            text-align: center;
        }
        .form-label {
            color: #003399;
            font-weight: 600;
        }
        .form-control:focus {
            border-color: #CC0000;
            box-shadow: 0 0 0 0.25rem rgba(204, 0, 0, 0.1);
        }
        .btn-upe-primary {
            background-color: #CC0000;
            color: #FFFFFF;
            border: none;
            font-weight: 600;
            padding: 12px;
        }
        .btn-upe-primary:hover {
            background-color: #a30000;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <div class="card login-card shadow">
                    <div class="login-header">
                        <h3 class="fw-bold mb-1">UPE LOJA DE ELETRÔNICOS</h3>
                        <p class="mb-0 opacity-75">Área Administrativa</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="mensagem-erro" class="alert alert-danger d-none shadow-sm" role="alert"></div>

                        <form id="form-login">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="admin@upe.com" required>
                            </div>

                            <div class="mb-4">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
                            </div>

                            <button type="submit" class="btn btn-upe-primary w-100">Entrar</button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="cadastro.html" class="text-decoration-none" style="color: #003399;">Não tem conta? Cadastre-se</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1055;">
        <div id="liveToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" id="toastMensagem"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = "https://upe-loja-eletronicos.onrender.com";

        function mostrarToast(mensagem, variante) {
            const toastElement = $('#liveToast');
            const toastCorpo = $('#toastMensagem');
            toastElement.removeClass('bg-success bg-danger bg-warning bg-info').addClass(`bg-${variante}`);
            toastCorpo.text(mensagem);
            const bsToast = new bootstrap.Toast(toastElement[0]);
            bsToast.show();
        }

        $(document).ready(function() {
            if (localStorage.getItem('token')) {
                window.location.href = 'produtos/index.html';
            }

            const toastPendente = localStorage.getItem('toast_sucesso');
            if (toastPendente) {
                mostrarToast(toastPendente, "success");
                localStorage.removeItem('toast_sucesso');
            }
        });

        $('#form-login').on('submit', function(e) {
            e.preventDefault();

            const email = $('#email').val().trim();
            const senha = $('#senha').val();

            $.ajax({
                url: `${API_URL}/login`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ email: email, senha: senha }),
                success: function(resposta) {
                    if (resposta.erro) {
                        $('#mensagem-erro')
                            .text(resposta.erro)
                            .removeClass('d-none');
                        return;
                    }

                    
                    localStorage.setItem('token', resposta.access_token);
                    localStorage.setItem('usuario_nome', resposta.usuario.nome);
                    localStorage.setItem('usuario_email', resposta.usuario.email);

                    window.location.href = 'produtos/index.html';
                },
                error: function(xhr) {
                    if (xhr.status === 401) {
                        $('#mensagem-erro')
                            .text("Email ou senha inválidos.")
                            .removeClass('d-none');
                    } else {
                        $('#mensagem-erro')
                            .text("Erro de conexão com o servidor.")
                            .removeClass('d-none');
                    }
                }
            });
        });
    </script>
</body>
</html>
