<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPE Loja de Eletrônicos - Nova Categoria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #FFFFFF; font-family: sans-serif; }
        .form-card { border: none; border-radius: 8px; }
        .form-label { color: #003399; font-weight: 600; }
        .form-control:focus { border-color: #CC0000; box-shadow: 0 0 0 0.25rem rgba(204, 0, 0, 0.1); }
        .btn-upe-primary { background-color: #CC0000; color: #FFFFFF; border: none; font-weight: 600; }
        .btn-upe-primary:hover { background-color: #a30000; color: #FFFFFF; }
        .btn-upe-secondary { background-color: #6c757d; color: #FFFFFF; border: none; font-weight: 600; }
        .btn-upe-secondary:hover { background-color: #5a6268; color: #FFFFFF; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div id="mensagem-erro" class="alert alert-danger d-none shadow-sm mb-3" role="alert"></div>
                <div class="card form-card shadow">
                    <div class="card-body p-4">
                        <h4 class="mb-4 fw-bold text-center" style="color: #003399;">Cadastrar Nova Categoria</h4>
                        <form id="form-criar">
                            <div class="mb-4">
                                <label for="nome" class="form-label">Nome da Categoria</label>
                                <input type="text" class="form-control form-control-lg" id="nome" placeholder="Ex: Processadores High-End" required>
                            </div>
                            <div class="d-flex justify-content-between">
                                <a href="index.html" class="btn btn-upe-secondary px-4">Voltar</a>
                                <button type="submit" class="btn btn-upe-primary px-4">Salvar Categoria</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script>
        const API_URL = "http://127.0.0.1:8000/categorias";
        $('#form-criar').on('submit', function(e) {
            e.preventDefault();
            $.ajax({
                url: API_URL,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ nome: $('#nome').val() }),
                success: function() { window.location.href = "index.html"; },
                error: function(xhr) {
                    if (xhr.status === 422) $('#mensagem-erro').text("⚠️ Erro 422: Dados inválidos.").removeClass('d-none');
                    else $('#mensagem-erro').text("⚠️ Erro ao salvar dados.").removeClass('d-none');
                }
            });
        });
    </script>
</body>
</html>
